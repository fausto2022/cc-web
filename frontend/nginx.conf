server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /cc-web {
        return 301 /cc-web/;
    }

    location = /cc-web/ {
        try_files /index.html =404;
    }

    location = /cc-web/api {
        return 308 /cc-web/api/;
    }

    location ^~ /cc-web/api/ {
        proxy_pass http://cc-web:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ^~ /cc-web/assets/ {
        rewrite ^/cc-web/(.*)$ /$1 break;
        try_files $uri =404;
    }

    location ^~ /cc-web/ {
        rewrite ^/cc-web/(.*)$ /$1 break;
        try_files $uri @cc_web_spa;
    }

    location @cc_web_spa {
        try_files /index.html =404;
    }

    location / {
        return 404;
    }
}
