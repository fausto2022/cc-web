services:
  cc-web-frontend:
    build:
      context: ./frontend
      args:
        VITE_BASE_PATH: /cc-web/
    restart: unless-stopped
    ports:
      - "127.0.0.1:18090:80"
    depends_on:
      - cc-web
  cc-web:
    build:
      context: ./backend
    restart: unless-stopped
    user: "0:0"
    environment:
      CC_WEB_LISTEN: 0.0.0.0:8080
      CC_WEB_DB_PATH: /data/cc-web.db
      CC_WEB_ALLOW_CONTAINER_BIND: "true"
      CC_WEB_HOST_ROOT: /host
      CC_WEB_PUBLIC_ORIGIN: https://103.11.77.113
      CC_WEB_TRUSTED_PROXIES: 172.26.0.1/32
    ports:
      - "127.0.0.1:18089:8080"
    volumes:
      - cc-web-data:/data
      - /:/host:rw
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  cc-web-data:
